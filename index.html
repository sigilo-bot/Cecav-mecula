<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CECAVI — Centro Educacional Caminho da Vida</title>
  
  <!-- Tailwind CSS CDN -->
  <script>
    (function () {
      function box(t) { var d = document.getElementById('cecavi-diag') || document.createElement('pre'); d.id = 'cecavi-diag';
        d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:10px;background:#fef2f2;color:#991b1b;font:12px monospace;white-space:pre-wrap;max-height:60vh;overflow:auto';
        d.textContent += t + '\n'; (document.body || document.documentElement).appendChild(d); }
      function quiet() { return !document.getElementById('boot') && !/[?&]debug=1/.test(location.search); }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window) { // erro de carregamento de um recurso
          var u = String(t.src || t.href || '');
          if (t.tagName !== 'SCRIPT') return; // imagens partidas, iframes, etc.: não incomodam o utilizador
          if (/userCodeAppPanel|googleusercontent\.com/.test(u)) return; // componentes internos do Google
        }
        if (quiet()) return;
        box('ERRO: ' + (e.message || '') + (t && t.src ? ' (não carregou: ' + t.src + ')' : '') + (e.lineno ? ' linha ' + e.lineno : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { if (quiet()) return; box('ERRO: ' + (e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        if (document.getElementById('boot')) box('A app não arrancou. Bibliotecas: React=' + !!window.React + ' ReactDOM=' + !!window.ReactDOM + ' Babel=' + !!window.Babel + ' Tailwind=' + !!window.tailwind + ' lucide=' + !!window.lucide + ' jsPDF=' + !!window.jspdf + '\nSe alguma for false, a rede bloqueou essa biblioteca.');
      }, 12000);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#16a34a',
            primaryHover: '#15803d',
            emeraldBg: '#ecfdf5',
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.468.0"></script>

  <!-- jsPDF for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <!-- pdf.js para ler PDFs de "Informações do CECAVI" -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Permitir selecionar e copiar qualquer texto do sistema */
    html, body, div, p, span, h1, h2, h3, h4, td, th, li, label, a {
      -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
    }
    button, [role="button"], .no-select { -webkit-user-select: none; user-select: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
  <div id="root"><p id="boot" style="padding:24px;font:14px sans-serif;color:#475569">A carregar CECAVI...</p></div>

  <!-- APLICAÇÃO REACT COMPLETA CECAVI v6 -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const INP = 'w-full h-9 px-3 text-xs bg-slate-50 border border-slate-200 rounded-xl';
    const BTN = 'h-8 px-3 bg-[#16a34a] hover:bg-[#15803d] text-white text-xs font-bold rounded-xl flex items-center gap-1';
    const LBL = 'text-xs font-bold text-slate-700 block mb-1';
    // Permissões de sub-administradores (agrupadas por módulo)
    const PERM_GROUPS = [
      { title: 'Módulo Financeiro & Cobranças', items: [['fin_pagamentos', 'Registar / Validar Pagamentos'], ['fin_matriz', 'Matriz Mensal (Março-Outubro)'], ['fin_emola', 'Transações e-Mola SMS']] },
      { title: 'Módulo Académico & Alunos', items: [['aca_alunos', 'Alunos (Fichas & Matrículas)'], ['aca_turmas', 'Classes & Turmas'], ['aca_avaliacoes', 'Avaliações (PDF)'], ['aca_horarios', 'Horários']] },
      { title: 'Comunicação & Institucional', items: [['com_comunicados', 'Comunicados / Notificações'], ['com_info', 'Info CECAVI (Visão, Missão, Valores)']] },
      { title: 'Segurança & Administração Geral', items: [['sis_utilizadores', 'Gestão de Utilizadores'], ['sis_config', 'Configurações do Sistema (propina 200MT, ano letivo, conta e-Mola)'], ['sis_logs', 'Registo de Atividades (Logs)']] }
    ];
    const PERM_PRESETS = [
      { name: 'Secretaria (Financeiro + Alunos)', perms: ['fin_pagamentos', 'fin_matriz', 'fin_emola', 'aca_alunos'] },
      { name: 'Coordenação Pedagógica (Académico + Comunicados)', perms: ['aca_alunos', 'aca_turmas', 'aca_avaliacoes', 'aca_horarios', 'com_comunicados', 'com_info'] }
    ];
    const ROLE_LABEL = { admin: 'Administrador', subadmin: 'Sub-administrador', teacher: 'Professor', parent: 'Encarregado' };
    const levelOf = (n) => { const t = String(n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\s]/g, ''); return /^pre1/.test(t) ? 1 : (/^pre2/.test(t) ? 2 : 0); };
    const statusBadge = (st) => st === 'Graduado' ? 'bg-blue-50 text-blue-700 border-blue-200' : (st === 'Inactivo' ? 'bg-slate-100 text-slate-600 border-slate-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200');
    const statusLabel = (st) => st === 'Graduado' ? 'Graduado(a)' : (st === 'Inactivo' ? 'Transferido(a)/Inactivo' : 'Activa');
    function Modal({ title, onClose, wide, children }) {
      return (
        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
          <div className={`bg-white w-full ${wide ? 'max-w-3xl' : 'max-w-md'} rounded-3xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto`}>
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-bold text-sm text-slate-900">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-lg">×</button>
            </div>
            {children}
          </div>
        </div>
      );
    }
    const DAYS = [['seg', 'Segunda'], ['ter', 'Terça'], ['qua', 'Quarta'], ['qui', 'Quinta'], ['sex', 'Sexta']];

    // Normalizador de texto sem acentos
    function normalizeText(str) {
      if (!str) return '';
      return String(str)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    // ══════════════════════════════════════════════════════════════════════
    // v7 — UTILITÁRIOS, RECIBO OFICIAL, CONFIGURAÇÕES, INFO CECAVI, ASSISTENTE PÚBLICO
    // ══════════════════════════════════════════════════════════════════════
    const DEFAULT_MONTHS = ['Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro'];
    const ALL_MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    const getActiveMonths = (s) => (s && s.available_months && s.available_months.length ? s.available_months : DEFAULT_MONTHS);
    const fmtMT = (n) => Number(n || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' MT';
    const AI_FRIENDLY = 'De momento estou com muitos pedidos. Por favor, tente novamente dentro de alguns instantes.';

    // ── Imagens escolhidas do armazenamento do telefone (sem URL) ─────────────
    function readPicture(file, maxSide, maxChars, square) {
      return new Promise((resolve, reject) => {
        if (!file || !/^image\//.test(file.type)) return reject(new Error('Escolha um ficheiro de imagem.'));
        const fr = new FileReader();
        fr.onerror = () => reject(new Error('Não foi possível ler a imagem.'));
        fr.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Imagem inválida.'));
          img.onload = () => {
            let sw = img.width, sh = img.height, sx = 0, sy = 0, dw, dh;
            if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = m; sh = m; dw = dh = Math.min(maxSide, m); }
            else { const k = Math.min(1, maxSide / Math.max(sw, sh)); dw = Math.max(1, Math.round(sw * k)); dh = Math.max(1, Math.round(sh * k)); }
            let q = 0.85, scale = 1;
            for (let t = 0; t < 10; t++) {
              const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(dw * scale)); c.height = Math.max(1, Math.round(dh * scale));
              const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
              x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
              const out = c.toDataURL('image/jpeg', q);
              if (out.length <= maxChars) return resolve(out);
              q = Math.max(0.4, q - 0.1); if (q <= 0.4) scale *= 0.85;
            }
            reject(new Error('A imagem é demasiado grande. Escolha outra mais pequena.'));
          };
          img.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    }

    const scoreTxt = (a) => (a.score == null ? '—' : a.score + '/' + a.max_score);
    const imgCache = {};
    const overlay = { call: null, view: null };

    function Avatar({ src, name, size = 40, className = '' }) {
      const [bad, setBad] = useState(false);
      useEffect(() => { setBad(false); }, [src]);
      const ok = src && !bad && /^(data:image|https?:)/.test(src);
      const initials = String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
      return ok
        ? <img src={src} alt="" onError={() => setBad(true)} style={{ width: size, height: size }} className={'rounded-full object-cover shrink-0 ' + className} />
        : <div style={{ width: size, height: size, fontSize: size * 0.36 }} className={'rounded-full bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center shrink-0 ' + className}>{initials}</div>;
    }

    // Imagem guardada no servidor (avaliações / horários), carregada só quando é preciso
    // Campo de documento do aluno (imagem do telemóvel): ver / carregar / trocar / remover
    function DocField({ label, url, newImg, removed, childName, onPick, onClear }) {
      const has = !!newImg || (!!url && !removed);
      return (
        <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
          <div className="flex items-center justify-between gap-2">
            <span className="text-xs font-bold text-slate-700">{label}</span>
            <span className={'text-[10px] font-bold ' + (has ? 'text-emerald-600' : 'text-slate-400')}>{newImg ? 'Nova imagem (por gravar)' : has ? 'Anexado' : 'Sem documento'}</span>
          </div>
          {newImg && <img src={newImg} alt="" className="max-h-32 rounded-xl border border-slate-200" />}
          <div className="flex flex-wrap gap-2">
            {!newImg && url && !removed && <button type="button" onClick={() => overlay.view && overlay.view({ key: url.slice(4), title: label + ' — ' + childName })} className="h-8 px-3 bg-white border border-slate-200 text-xs font-bold rounded-xl">Ver</button>}
            <label className={BTN + ' cursor-pointer justify-center'}>{has ? 'Trocar imagem' : 'Carregar do telemóvel'}
              <input type="file" accept="image/*" className="hidden" onChange={async (e) => {
                const fl = e.target.files[0]; e.target.value = ''; if (!fl) return;
                try { onPick(await readPicture(fl, 1600, 420000)); } catch (er) { alert(er.message || er); }
              }} />
            </label>
            {has && <button type="button" onClick={onClear} className="h-8 px-3 bg-white border border-red-200 text-red-600 text-xs font-bold rounded-xl">Remover</button>}
          </div>
        </div>
      );
    }

    function LazyImage({ imgKey, className, zoomable = true, title }) {
      const [src, setSrc] = useState(imgCache[imgKey] || '');
      const [err, setErr] = useState('');
      useEffect(() => {
        let live = true; setErr('');
        if (imgCache[imgKey]) { setSrc(imgCache[imgKey]); return; }
        setSrc('');
        GasBridge.call('getImage', { key: imgKey })
          .then((r) => { if (!live) return; if (r && r.data) { imgCache[imgKey] = r.data; setSrc(r.data); } else setErr('Imagem indisponível.'); })
          .catch((e) => { if (live) setErr((e && e.message) || 'Não foi possível carregar a imagem.'); });
        return () => { live = false; };
      }, [imgKey]);
      if (err) return <p className="text-xs text-red-500 py-2">{err}</p>;
      if (!src) return <p className="text-xs text-slate-400 py-4 text-center">A carregar imagem...</p>;
      return <img src={src} alt={title || ''} className={className} onClick={() => { if (zoomable && overlay.view) overlay.view({ src, title }); }} />;
    }

    function AttachmentLink({ a, className = '' }) {
      const u = a.attachment_url;
      if (!u) return <span className="text-slate-400">Sem anexo</span>;
      if (/^img:/.test(u)) return (
        <button type="button" onClick={() => overlay.view && overlay.view({ key: u.slice(4), title: a.subject })} className={className}>
          <i data-lucide="image" className="w-3.5 h-3.5"></i><span>Ver imagem</span>
        </button>
      );
      return <a href={u} target="_blank" className={className}><span>{a.attachment_name || 'Ver Anexo'}</span></a>;
    }

    // Toque num número → pergunta "Ligar?" → abre a marcação do telefone
    const telOf = (raw) => { let d = String(raw || '').replace(/[^\d+]/g, ''); if (/^00/.test(d)) d = '+' + d.slice(2); if (/^\d{9}$/.test(d)) d = '+258' + d; return d; };
    // Abre o aplicativo Telefone (marcador) com o número. Dentro do Apps Script a página corre num iframe,
    // por isso navegamos a janela de topo (a partir do toque do utilizador) e há alternativas de reserva.
    const dialNumber = (tel, done) => {
      const url = 'tel:' + tel;
      let ok = false;
      try { window.top.location.href = url; ok = true; } catch (e) {}
      if (!ok) { try { const w = window.open(url, '_top'); ok = !!w || true; } catch (e) {} }
      if (!ok) { try { window.location.href = url; } catch (e) {} }
      setTimeout(() => { if (done) done(); }, 600);
    };
    function PhoneLink({ number, guardian, student, className = '' }) {
      const n = String(number || '').trim(), tel = telOf(n);
      if (!/\d{6,}/.test(tel)) return <span className={className + ' !text-slate-400'}>{n && !/^#/.test(n) ? n : '—'}</span>;
      return (
        <button type="button" onClick={(e) => { e.stopPropagation(); if (overlay.call) overlay.call({ number: n, tel, guardian, student }); }}
          className={className + ' underline decoration-dotted underline-offset-2 text-left'}>{n}</button>
      );
    }
    function OverlayHost() {
      const [call, setCall] = useState(null);
      const [view, setView] = useState(null);
      const [zoom, setZoom] = useState(false);
      useEffect(() => { overlay.call = setCall; overlay.view = (v) => { setZoom(false); setView(v); }; return () => { overlay.call = null; overlay.view = null; }; }, []);
      return (
        <>
          {call && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-[70]">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-3 text-center">
                <div className="mx-auto h-14 w-14 rounded-full bg-emerald-100 flex items-center justify-center text-2xl">📞</div>
                <h3 className="font-bold text-base text-slate-900">Deseja ligar para o encarregado?</h3>
                {(call.guardian || call.student) && <p className="text-xs text-slate-500">{call.guardian || ''}{call.student ? ' · Aluno: ' + call.student : ''}</p>}
                <p className="font-mono font-bold text-lg text-[#16a34a]">{call.number}</p>
                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button type="button" onClick={() => setCall(null)} className="h-10 bg-white border border-slate-200 text-slate-700 text-sm font-bold rounded-xl">Cancelar</button>
                  <button type="button" onClick={() => dialNumber(call.tel, () => setCall(null))}
                    className="h-10 bg-[#16a34a] hover:bg-[#15803d] text-white text-sm font-bold rounded-xl flex items-center justify-center">Sim, Ligar</button>
                </div>
              </div>
            </div>
          )}
          {view && (
            <div className="fixed inset-0 bg-black/90 z-[70] flex flex-col">
              <div className="flex justify-between items-center p-3 text-white">
                <span className="text-xs font-bold truncate pr-2">{view.title || 'Imagem'}</span>
                <div className="flex items-center gap-2 shrink-0">
                  <button type="button" onClick={() => setZoom(!zoom)} className="h-8 px-3 bg-white/15 rounded-xl text-xs font-bold">{zoom ? 'Ajustar' : 'Ampliar'}</button>
                  <button type="button" onClick={() => setView(null)} className="h-8 w-8 bg-white/15 rounded-xl text-lg leading-none">×</button>
                </div>
              </div>
              <div className="flex-1 overflow-auto flex items-start justify-center p-2">
                {view.src
                  ? <img src={view.src} alt="" className={zoom ? 'w-[220%] max-w-none' : 'max-w-full max-h-full object-contain'} />
                  : <LazyImage imgKey={view.key} zoomable={false} className={zoom ? 'w-[220%] max-w-none' : 'max-w-full max-h-full object-contain'} />}
              </div>
            </div>
          )}
        </>
      );
    }

    // Pergunta à IA: 2 tentativas; a cascata das 3 chaves é feita no servidor
    async function askAi(action, payload) {
      for (let i = 0; i < 2; i++) {
        try { const r = await GasBridge.call(action, payload); if (r && r.reply) return r.reply; }
        catch (e) { if (e && /Sess[ãa]o expirada/.test(e.message || '')) throw e; }
      }
      return AI_FRIENDLY;
    }

    // Redimensiona/comprime a imagem escolhida (mantém transparência em PNG quando possível)
    function readImage(file, maxW, maxH) {
      return new Promise((resolve, reject) => {
        if (!file || !/^image\//.test(file.type)) return reject(new Error('Escolha um ficheiro de imagem.'));
        const fr = new FileReader();
        fr.onerror = () => reject(new Error('Não foi possível ler a imagem.'));
        fr.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Imagem inválida.'));
          img.onload = () => {
            const k = Math.min(1, maxW / img.width, maxH / img.height);
            const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            let out = c.toDataURL('image/png');
            if (out.length > 150000) {
              const c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
              const x2 = c2.getContext('2d'); x2.fillStyle = '#fff'; x2.fillRect(0, 0, w, h); x2.drawImage(img, 0, 0, w, h);
              out = c2.toDataURL('image/jpeg', 0.85);
            }
            resolve(out);
          };
          img.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    }
    function loadImg(src) {
      return new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => reject(new Error('Imagem inválida.')); i.src = src; });
    }
    const imgFmt = (src) => (/^data:image\/jpe?g/.test(src) ? 'JPEG' : 'PNG');

    // Logotipo dentro de um círculo com borda fina laranja (versão PNG para o PDF)
    async function circleLogo(src, px) {
      const c = document.createElement('canvas'); c.width = px; c.height = px;
      const x = c.getContext('2d'), r = px / 2, ring = Math.max(3, Math.round(px * 0.015));
      x.fillStyle = '#ffffff'; x.beginPath(); x.arc(r, r, r, 0, Math.PI * 2); x.fill();
      if (src) {
        try {
          const img = await loadImg(src), k = Math.max(px / img.width, px / img.height), w = img.width * k, h = img.height * k;
          x.save(); x.beginPath(); x.arc(r, r, r - ring, 0, Math.PI * 2); x.clip();
          x.drawImage(img, (px - w) / 2, (px - h) / 2, w, h); x.restore();
        } catch (e) {}
      } else {
        x.fillStyle = '#1B3399'; x.font = 'bold ' + Math.round(px * 0.2) + 'px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('CECAVI', r, r);
      }
      x.strokeStyle = '#f97316'; x.lineWidth = ring; x.beginPath(); x.arc(r, r, r - ring / 2, 0, Math.PI * 2); x.stroke();
      return c.toDataURL('image/png');
    }

    function SchoolLogo({ src, size = 56 }) {
      return (
        <div style={{ width: size, height: size, borderRadius: '50%', border: '2px solid #f97316', overflow: 'hidden', background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          {src ? <img src={src} alt="Logotipo" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <span style={{ fontSize: size * 0.42 }}>🎓</span>}
        </div>
      );
    }

    // ── RECIBO OFICIAL (modelo: cabeçalho azul, título, dados, TOTAL PAGO, assinatura, carimbo) ──
    async function buildReceiptPdf(rc, st) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const BLUE = [27, 51, 153], W = 210;
      st = st || {};

      // Cabeçalho azul + logotipo circular com borda laranja fina

    // Extracção de texto de PDF (para "Informações do CECAVI")
    async function extractPdfText(file) {
      if (!window.pdfjsLib) throw new Error('O leitor de PDF não carregou. Verifique a internet e recarregue a página.');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      let out = '';
      for (let p = 1; p <= pdf.numPages; p++) {
        const tc = await (await pdf.getPage(p)).getTextContent();
        out += tc.items.map((i) => i.str).join(' ') + '\n\n';
      }
      return out.replace(/[ \t]+/g, ' ').trim();
    }

    // ── ASSISTENTE PÚBLICO (ecrã de login) ─────────────────────────────────
    function PublicAssistant({ info }) {
      const [open, setOpen] = useState(false);
      const [msgs, setMsgs] = useState([{ role: 'assistant', text: 'Olá! Sou a assistente virtual do centro. Pergunte-me sobre horários, mensalidades, eventos e informações do CECAVI.' }]);
      const [input, setInput] = useState('');
      const [busy, setBusy] = useState(false);
      const endRef = useRef(null);
      useEffect(() => { if (endRef.current) endRef.current.scrollIntoView({ block: 'end' }); }, [msgs, open]);
      const send = async (e) => {
        e.preventDefault();
        const q = input.trim(); if (!q || busy) return;
        const hist = msgs.slice(1);
        setMsgs([...msgs, { role: 'user', text: q }]); setInput(''); setBusy(true);
        try {
          const reply = await askAi('publicAI', { message: q, history: hist });
          setMsgs((m) => [...m, { role: 'assistant', text: reply }]);
        } catch (err) { setMsgs((m) => [...m, { role: 'assistant', text: AI_FRIENDLY }]); }
        setBusy(false);
      };
      return (
        <div className="fixed bottom-4 right-4 z-40">
          {open ? (
            <div className="w-80 sm:w-96 bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col h-[420px]">
              <div className="bg-[#16a34a] p-3 text-white flex justify-between items-center">

              </div>
              <div className="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
                {msgs.map((m, i) => (
                  <div key={i} className={'p-2.5 rounded-2xl max-w-[85%] whitespace-pre-wrap ' + (m.role === 'user' ? 'bg-[#16a34a] text-white ml-auto' : 'bg-slate-100 text-slate-800')}>{m.text}</div>

              </div>

                <button type="submit" disabled={busy} className="h-8 px-3 bg-[#16a34a] text-white rounded-xl text-xs font-bold disabled:opacity-50">Enviar</button>
              </form>
            </div>
          ) : (
            <button onClick={() => setOpen(true)} className="h-12 px-4 rounded-full bg-[#16a34a] hover:bg-[#15803d] text-white shadow-lg flex items-center justify-center gap-2 text-xs font-bold" title="Conversar com a assistente virtual">
              <span style={{ fontSize: 18 }}>✨</span><span>Assistente</span>
            </button>
          )}
        </div>
      );
    }

    // ── INFORMAÇÕES DO CECAVI (texto / PDF) para o assistente ──────────────
    function InfoPanel({ infos, onChanged }) {
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [busy, setBusy] = useState('');
      const groups = useMemo(() => {
        const m = {}; (infos || []).forEach((e) => { const g = e.id.replace(/_\d+$/, ''); (m[g] = m[g] || []).push(e); });
        return Object.values(m).reverse();
      }, [infos]);
      const total = (infos || []).reduce((a, e) => a + e.content.length, 0);

      const addText = async () => {
        if (!content.trim()) { alert('Escreva o conteúdo da informação.'); return; }
        setBusy('text');
        try { await GasBridge.call('saveInfo', { title, content, type: 'text' }); setTitle(''); setContent(''); await onChanged(); }
        catch (e) { alert(e.message || e); }
        setBusy('');
      };
      const addFile = async (file) => {
        if (!file) return;
        setBusy('file');
        try {
          const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
          const text = isPdf ? await extractPdfText(file) : await file.text();
          if (!text || text.replace(/\s/g, '').length < 20) throw new Error('Não foi possível extrair texto deste ficheiro (pode ser um PDF digitalizado/imagem). Use um PDF com texto selecionável ou cole o texto.');
          await GasBridge.call('saveInfo', { title, content: text, type: isPdf ? 'pdf' : 'text', file_name: file.name });
          setTitle(''); await onChanged();
          alert('Documento adicionado (' + text.length + ' caracteres lidos).');
        } catch (e) { alert(e.message || e); }
        setBusy('');
      };
      const remove = async (g) => {
        if (!confirm('Eliminar esta informação?')) return;
        try { await GasBridge.call('deleteInfo', { id: g[0].id }); await onChanged(); } catch (e) { alert(e.message || e); }
      };

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-2xs space-y-3">
            <div>
              <h3 className="text-sm font-bold text-slate-900">Informações do CECAVI</h3>
              <p className="text-[11px] text-slate-500 mt-0.5">O assistente virtual (público e dos utilizadores) usa estas informações para responder a perguntas dos pais e encarregados sobre o centro educacional.</p>
            </div>
            <div><label className={LBL}>Título / Assunto (opcional)</label><input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ex: Horário de funcionamento, Missão, Eventos..." className={INP} /></div>
            <div><label className={LBL}>Conteúdo da Informação</label>
              <textarea rows="5" value={content} onChange={(e) => setContent(e.target.value)} placeholder="Escreva aqui informações sobre o CECAVI que o assistente deve conhecer..." className="w-full p-3 text-xs bg-slate-50 border border-slate-200 rounded-xl" /></div>
            <div className="flex flex-wrap gap-2">
              <button disabled={!!busy} onClick={addText} className={BTN + ' h-9 disabled:opacity-50'}>{busy === 'text' ? 'A guardar...' : 'Adicionar Texto'}</button>
              <label className={'h-9 px-3 bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-xl flex items-center gap-1 cursor-pointer ' + (busy ? 'opacity-50 pointer-events-none' : '')}>
                {busy === 'file' ? 'A ler documento...' : 'Adicionar PDF / Documento'}
                <input type="file" accept=".pdf,.txt,application/pdf,text/plain" className="hidden" onChange={(e) => { const fl = e.target.files[0]; e.target.value = ''; addFile(fl); }} />
              </label>
            </div>
            <p className="text-[10px] text-slate-400">PDF com texto selecionável ou ficheiro .txt. O assistente lê até cerca de 40 000 caracteres no total. Actualmente: {total.toLocaleString('pt-PT')} caracteres{total > 40000 ? ' — acima do limite; remova informação antiga.' : '.'}</p>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-2xs space-y-2">
            <h3 className="text-sm font-bold text-slate-900">Informações adicionadas ({groups.length})</h3>
            {groups.length === 0 && <p className="text-xs text-slate-400">Ainda não adicionou nenhuma informação.</p>}
            {groups.map((g) => {
              const chars = g.reduce((a, e) => a + e.content.length, 0);
              return (
                <div key={g[0].id} className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between gap-3">
                  <div className="min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-xs font-bold text-slate-900 break-words">{g[0].title.replace(/ \(parte 1\/\d+\)$/, '')}</span>
                      <span className={'text-[10px] font-bold px-1.5 py-0.5 rounded-md ' + (g[0].type === 'pdf' ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-600')}>{g[0].type === 'pdf' ? 'PDF' : 'Texto'}</span>
                    </div>
                    <p className="text-[11px] text-slate-500 mt-1 line-clamp-2 break-words">{g[0].content.slice(0, 160)}{g[0].content.length > 160 ? '…' : ''}</p>
                    <p className="text-[10px] text-slate-400 mt-1">{chars.toLocaleString('pt-PT')} caracteres · {String(g[0].created_at).slice(0, 10)}{g[0].file_name ? ' · ' + g[0].file_name : ''}</p>
                  </div>
                  <button onClick={() => remove(g)} className="h-7 px-2.5 self-start bg-white border border-red-200 text-red-600 text-[11px] font-bold rounded-lg">Eliminar</button>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

      const [stYear, setStYear] = useState('');
      const [stState, setStState] = useState('ativos');
      const [stSearch, setStSearch] = useState('');
      const [mxYear, setMxYear] = useState('');
      const [accessModal, setAccessModal] = useState(null);
      const hasPerm = (spec) => !!currentUser && (currentUser.role === 'admin' ||
        (currentUser.role === 'subadmin' && String(spec).split('|').some(p => (currentUser.permissoes || []).includes(p))));

      // Modal do Professor
      const [teacherStudentDetail, setTeacherStudentDetail] = useState(null);

      // Modal de Troca Obrigatória de Senha
      const [mustChangePasswordOpen, setMustChangePasswordOpen] = useState(false);

      // Assistente Virtual IA
      const [aiOpen, setAiOpen] = useState(false);
      const [aiMessages, setAiMessages] = useState([
        { role: 'assistant', text: 'Olá! Sou a Assistente Virtual do CECAVI Mecula. Como posso ajudar com mensalidades, turmas, avaliações ou rotinas escolares?' }
      ]);
      const [aiInput, setAiInput] = useState('');
      const [pubInfo, setPubInfo] = useState(null);

      // Formulário de Login
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loginLoading, setLoginLoading] = useState(false);

      // Carregar dados iniciais
      const loadData = async () => {
        try {
          setIsLoading(true);
          const data = await GasBridge.call('getInitialAppData');
          setAppData(data);
        } catch (err) {
          alert(err.message || err); setCurrentUser(null);
        } finally {
          setIsLoading(false);
        }
      };

      const refresh = async () => { setAppData(await GasBridge.call('getInitialAppData')); };
      const act = async (action, data, okMsg) => {
        try { await GasBridge.call(action, data); await refresh(); if (okMsg) alert(okMsg); return true; }
        catch (e) { alert(e.message || e); return false; }
      };
      useEffect(() => {
        if (parentModal !== 'pagar_emola' || !emola || emola.step !== 1 || !emola.childName.trim()) return;
        const t = setTimeout(async () => {
          try { const i = await GasBridge.call('emolaPrepare', { child_name: emola.childName }); setEmola(p => p && ({ ...p, info: i })); } catch (e) {}
        }, 400);
        return () => clearTimeout(t);
      }, [emola && emola.childName, parentModal]);

      useEffect(() => { GasBridge.call('getPublicInfo').then(setPubInfo).catch(() => {}); }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Login validado no servidor (Apps Script)
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        if (!loginUser.trim() || !loginPass.trim()) { setLoginError('Por favor, preencha o nome de utilizador e a palavra-passe.'); return; }
        setLoginLoading(true);
        try {
          const r = await GasBridge.call('login', { username: loginUser, password: loginPass });
          GasBridge.token = r.token;
          setCurrentUser({ ...r.user, display_name: r.user.name || r.user.username });
          setAdminTab('overview');
          await loadData();
          if (r.user.must_change_password) setMustChangePasswordOpen(true);
        } catch (err) { setLoginError(err.message || 'Credenciais inválidas.'); }
        setLoginLoading(false);
      };

      // Troca de Senha Obrigatória
      const handleSaveNewPassword = async (e) => {
        e.preventDefault();
        if (newPasswordInput.length < 4) { alert('A nova palavra-passe deve ter pelo menos 4 caracteres.'); return; }
        if (newPasswordInput !== confirmPasswordInput) { alert('As palavras-passes não coincidem.'); return; }
        try {
          await GasBridge.call('changePassword', { oldPassword: '0000', newPassword: newPasswordInput });
          setMustChangePasswordOpen(false); setNewPasswordInput(''); setConfirmPasswordInput('');
          alert('Palavra-passe atualizada com sucesso! Bem-vindo ao sistema.');
        } catch (err) { alert(err.message || err); }
      };

      // Logout
      const handleLogout = () => {
        GasBridge.token = null; setAppData(null); setCurrentUser(null);
        setLoginUser('');
        setLoginPass('');
        setLoginError('');
      };

      // Assistente Virtual IA
      const handleSendAi = async (e) => {
        e.preventDefault();
        const q = aiInput.trim();
        if (!q || aiBusy) return;
        const hist = aiMessages.slice();
        setAiMessages([...hist, { role: 'user', text: q }]);
        setAiInput(''); setAiBusy(true);
        try {
          const reply = await askAi('askAI', { message: q, history: hist });
          setAiMessages(m => [...m, { role: 'assistant', text: reply }]);
        } catch (err) { setAiMessages(m => [...m, { role: 'assistant', text: (err && err.message) || AI_FRIENDLY }]); }
        setAiBusy(false);
      };

      // Rastreio de leitura de notificação
      const handleOpenParentNotifications = () => {
        setParentModal('notificacoes');
        if (appData?.notifications && currentUser) {
          appData.notifications.forEach(n => {
            GasBridge.call('markNotificationAsRead', {

              userName: currentUser.display_name || currentUser.username,
              role: 'parent'

        }
      };

      // Geração de Recibo em PDF (modelo oficial). Usa sempre as definições ACTUAIS
      // (logotipo, assinatura, carimbo, responsável), por isso qualquer alteração aplica-se a todos os recibos.
      const downloadReceipt = async (rc) => {
        try { await buildReceiptPdf(rc, appData.settings); }
        catch (e) { alert('Não foi possível gerar o recibo: ' + (e.message || e)); }
      };
      const downloadReceiptFor = async (month) => {
        try { const rc = await GasBridge.call('getReceipt', { month }); await downloadReceipt(rc); }
        catch (e) { alert(e.message || e); }
      };

      const downloadMatrixPdf = (list, label) => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape' });
        const M = getActiveMonths(appData.settings);
        const sumP = list.reduce((a, r) => a + r.total_paid, 0), sumD = list.reduce((a, r) => a + r.total_due, 0);
        doc.setFontSize(14); doc.text(`CECAVI — Relatório de Pagamento das Mensalidades ${appData.settings.academic_year}`, 14, 14);
        doc.setFontSize(9); doc.text(`Turma: ${label} · Mensalidade: ${appData.settings.monthly_fee} MT · Emitido em ${new Date().toLocaleDateString('pt-PT')}`, 14, 20);
        doc.autoTable({
          startY: 24, styles: { fontSize: 8 }, headStyles: { fillColor: [22, 163, 74] },
          head: [['N.º', 'Nome do aluno', 'Turma', ...M.map(m => m.slice(0, 3)), 'Pago (MT)', 'Devido (MT)']],
          body: list.map((r, i) => [i + 1, r.student_name, r.class_name, ...M.map(m => r.months[m] ? 'Pago' : '—'), r.total_paid, r.total_due]),
          foot: [['', 'TOTAL', '', ...M.map(() => ''), sumP, sumD]], footStyles: { fillColor: [241, 245, 249], textColor: 20 }
        });
        doc.save(`Pagamentos_CECAVI_${label.replace(/\s+/g, '_')}.pdf`);
      };

      const payEmola = async () => {
        setEmola(p => ({ ...p, busy: true, err: '' }));
        try {
          const r = await GasBridge.call('emolaPay', { child_name: emola.childName, sms: emola.sms });
          setEmola(p => ({ ...p, busy: false, receipt: r }));
          await refresh();
          downloadReceipt(r);
        } catch (e) { setEmola(p => ({ ...p, busy: false, err: e.message || String(e) })); }
      };

      if (currentUser && (isLoading || !appData)) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-4">
            <div className="h-12 w-12 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin mb-4"></div>
            <h2 className="text-lg font-bold text-slate-800">A carregar sistema CECAVI...</h2>
            <p className="text-xs text-slate-500 mt-1">Conectando ao Google Apps Script</p>
          </div>
        );
      }

      // ─────────────────────────────────────────────────────────────────────────
      // SE NÃO ESTIVER AUTENTICADO: TELA DE LOGIN
      // ─────────────────────────────────────────────────────────────────────────
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100">
            <div className="w-full max-w-md bg-white rounded-3xl border border-slate-200/90 shadow-xl p-6 sm:p-8 space-y-6">

                const outros = cur.length - p2.length - p1.length;
                const nextAct = appData.children.filter(c => c.status === 'Activa' && String(c.ano_letivo) === ny);
                const novos = nextAct.filter(c => levelOf(c.class_name) === 1).length;

                const run = async (action, msg, okTxt) => {

                  try { const r = await GasBridge.call(action, {}); await refresh(); alert(okTxt(r)); } catch (e) { alert(e.message || e); }

                const Step = ({ n, title, desc, children }) => (
                  <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">

                    <p className="text-xs text-slate-600">{desc}</p>
                    {children}

                return (
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-2xs space-y-4">

                      <h3 className="text-sm font-bold text-slate-900">Virada de Ano Letivo · {cy} → {ny}</h3>
                      <p className="text-xs text-slate-500">[Pré 1 A / Pré 1 B] → Promoção → [Pré 2] → Graduação → [Arquivo / Graduados]. Ninguém é eliminado: o histórico e a matriz de {cy} ficam arquivados.</p>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                      </Step>
                      <Step n="2" title="Pré 1 A/B → Pré 2" desc={`Move os alunos activos do Pré 1 para o Pré 2 de ${ny}. Alunos do Pré 1 a promover: ${p1.length}. Faça primeiro o passo 1 (vagas do Pré 2).`}>
                        <button disabled={!p1.length} onClick={() => run('rolloverPromote', `Promover ${p1.length} aluno(s) do Pré 1 para o Pré 2 de ${ny}?`, r => `${r.count} aluno(s) promovido(s) para o Pré 2 de ${r.ano_letivo}.`)} className={BTN + ' disabled:opacity-40'}>Promover Turma</button>
                      </Step>
                      <Step n="3" title="Novos ingressos" desc={`Inscreva as crianças de 4 anos no Pré 1 A e Pré 1 B (ano ${ny}). Já inscritos para ${ny}: ${novos}.`}>

                      </Step>
                      <Step n="4" title="Actualizar ano letivo" desc={`Muda o ano letivo de ${cy} para ${ny} e gera a nova matriz apenas com os alunos activos (${nextAct.length}). A matriz de ${cy} fica arquivada.${cur.length ? ` Pendentes dos passos 1-2: ${cur.length}.` : ''}${hasPerm('sis_config') ? '' : ' Requer a permissão "Configurações do Sistema".'}`}>
                        <button disabled={cur.length > 0 || !hasPerm('sis_config')} onClick={() => run('rolloverFinish', `Concluir a virada e passar para o ano letivo ${ny}? A matriz de ${cy} será arquivada.`, r => `Ano letivo ${r.ano_letivo} activo com ${r.ativos} aluno(s).`)} className={BTN + ' disabled:opacity-40'}>Concluir virada para {ny}</button>
                      </Step>
                    </div>
                    <p className="text-[11px] text-slate-500">Resumo: {cur.length} activo(s) em {cy} · {grad} graduado(s) no total · {appData.children.filter(c => c.status === 'Inactivo').length} no histórico (transferidos/inactivos).{outros > 0 ? ` Atenção: ${outros} aluno(s) activo(s) fora de Pré 1/Pré 2 — marque-os como Inactivo ou mude de turma antes do passo 4.` : ''}</p>

                          <th className="p-2.5">Aluno</th>

                          <th className="p-2.5">Valor</th>

                      <tbody className="divide-y divide-slate-100">

                      </tbody>

                        </div>
                      </div>

                      <span>Emitir Comunicado</span>

                        <p className="text-xs text-slate-600">{n.message}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {adminTab === 'users' && (() => {

                const locked = (u) => isMain(u) || (u.role === 'admin' && currentUser.role !== 'admin');
                const cName = (id) => (appData.classes.find(c => c.id === id) || {}).name;
                const acesso = (u) => {
                  if (u.role === 'teacher') {
                    const t = (u.turmas_permitidas && u.turmas_permitidas.length) ? u.turmas_permitidas : (u.class_id ? [u.class_id] : []);
                    return t.includes('*') ? 'Todas as turmas' : (t.map(cName).filter(Boolean).join(', ') || 'Sem turma');
                  }
                  if (u.role === 'subadmin') return `${(u.permissoes || []).length} permissão(ões)`;
                  return u.role === 'admin' ? 'Acesso total' : '—';
                };
                const mineP = currentUser.role === 'admin' ? null : (currentUser.permissoes || []);
                return (
                <div className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-2xs space-y-4">

                    <div><label className={LBL}>Utilizador</label><input value={newUser.username} onChange={(e) => setNewUser({ ...newUser, username: e.target.value })} className={INP} required /></div>
                    <div><label className={LBL}>Nome</label><input value={newUser.name} onChange={(e) => setNewUser({ ...newUser, name: e.target.value })} className={INP} /></div>
                    <div><label className={LBL}>Papel</label>
                      <select value={newUser.role} onChange={(e) => setNewUser({ ...newUser, role: e.target.value })} className={INP}>

                        {currentUser.role === 'admin' && <option value="admin">Administrador</option>}
                      </select></div>
                    <div><label className={LBL}>Turma inicial (professor)</label>
                      <select value={newUser.class_id} onChange={(e) => setNewUser({ ...newUser, class_id: e.target.value })} className={INP}>
                        <option value="">—</option>{appData.classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}

                    title,
                    message,
                    target_role: target,
                    author_name: 'Direção CECAVI'

                    ...prev,
                    notifications: [
                      {
                        id: 'notif_' + Date.now(),
                        title,
                        message,
                        target_role: target,
                        author_name: 'Direção CECAVI',
                        created_at: new Date().toLocaleDateString('pt-PT'),

                    <textarea name="message" rows="4" className="w-full p-3 text-xs bg-slate-50 border border-slate-200 rounded-xl" required></textarea>

                  <button type="submit" className="w-full h-9 bg-[#16a34a] hover:bg-[#15803d] text-white font-bold text-xs rounded-xl">
                    Publicar Comunicado
                  </button>
                </form>
              </div>
            </div>
          )}

          ────────────────────────────────────────────────────────────────────── */}

            <Modal title="Lançar Avaliação" onClose={() => { setAssessmentModalOpen(false); setAssessImg(null); }}>

                e.preventDefault();
                if (assessBusy) return;
                const f = e.target.elements;
                if (!f['score'].value.trim() && !assessImg) { alert('Indique a classificação ou carregue a imagem da avaliação.'); return; }
                setAssessBusy(true);
                const ok = await act('saveAssessment', {
                  id: 'ass_' + Date.now(), child_id: f['childId'].value, subject: f['subject'].value, trimester: f['trimester'].value,
                  score: f['score'].value, max_score: 20, image: assessImg ? assessImg.data : '', attachment_name: assessImg ? assessImg.name : ''
                }, 'Avaliação lançada com sucesso!');
                setAssessBusy(false);
                if (ok) { setAssessmentModalOpen(false); setAssessImg(null); }
              }} className="space-y-3">

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Lugar de Nascimento</label>

                  <div className="grid grid-cols-2 gap-2">
                    <div>

                      <input name="neighborhood" defaultValue={editingStudent.neighborhood} className="w-full h-9 px-3 text-xs bg-slate-50 border border-slate-200 rounded-xl" required />

                      <select name="class_id" defaultValue={editingStudent.class_id} className="w-full h-9 px-3 text-xs bg-slate-50 border border-slate-200 rounded-xl">

                  <div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Número de Telefone 2 (Opcional)</label>
                      <input name="phone2" defaultValue={editingStudent.phone2} className="w-full h-9 px-3 text-xs bg-slate-50 border border-slate-200 rounded-xl font-mono" />

                  <div>

                    <label className="text-xs font-bold text-slate-700 block">Documentos da Criança</label>
                    <DocField label="Doc. de Identificação (BI / Cédula / Certidão)" childName={editingStudent.full_name}
                      url={editingStudent.doc_identificacao_url} newImg={editingStudent.doc_identificacao_image} removed={editingStudent.doc_identificacao_remove}
                      onPick={(d) => setEditingStudent(p => ({ ...p, doc_identificacao_image: d, doc_identificacao_remove: false }))}
                      onClear={() => setEditingStudent(p => p.doc_identificacao_image ? ({ ...p, doc_identificacao_image: '' }) : ({ ...p, doc_identificacao_remove: true }))} />
                    <DocField label="Processo / Ficha de Matrícula" childName={editingStudent.full_name}
                      url={editingStudent.processo_aluno_url} newImg={editingStudent.processo_aluno_image} removed={editingStudent.processo_aluno_remove}
                      onPick={(d) => setEditingStudent(p => ({ ...p, processo_aluno_image: d, processo_aluno_remove: false }))}
                      onClear={() => setEditingStudent(p => p.processo_aluno_image ? ({ ...p, processo_aluno_image: '' }) : ({ ...p, processo_aluno_remove: true }))} />
                  </div>
                  <button type="submit" className="w-full h-9 bg-[#16a34a] hover:bg-[#15803d] text-white font-bold text-xs rounded-xl">
                    Gravar Informações do Aluno
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ─────────────────────────────────────────────────────────────────────
              MODAL: VISUALIZAR GRADE HORÁRIA COMPLETA
          ────────────────────────────────────────────────────────────────────── */}
          {editingClass && (
            <Modal title={editingClass.id ? 'Editar Turma' : 'Nova Turma'} onClose={() => setEditingClass(null)}>
              <form onSubmit={async (e) => {
                e.preventDefault();
                const f = e.target.elements;
                if (await act('saveClass', { id: editingClass.id, name: f['cname'].value.trim(), max_capacity: Number(f['cmax'].value) })) setEditingClass(null);
              }} className="space-y-3">
                <div><label className={LBL}>Nome da turma</label><input name="cname" defaultValue={editingClass.name} className={INP} required /></div>
                <div><label className={LBL}>Número máximo de alunos</label>
                  <input name="cmax" type="number" min="1" defaultValue={editingClass.max_capacity} className={INP} required />
                  {editingClass.id && <span className="text-[10px] text-slate-400">Matriculados actualmente: {editingClass.current_students}</span>}
                </div>
                <button type="submit" className={BTN + ' w-full justify-center h-9'}>Guardar Turma</button>
              </form>
            </Modal>
          )}

          {editingSchedule && (() => {
            const es = editingSchedule;
            const setP = (i, k, v) => setEditingSchedule({ ...es, periods: es.periods.map((p, n) => n === i ? { ...p, [k]: v } : p) });
            return (
              <Modal wide title={es.id ? 'Editar Horário' : 'Novo Horário'} onClose={() => setEditingSchedule(null)}>
                <div className="grid grid-cols-3 gap-2">
                  <div><label className={LBL}>Turma</label>
                    <select value={es.class_name} onChange={(e) => setEditingSchedule({ ...es, class_name: e.target.value })} className={INP}>
                      {appData.classes.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                    </select></div>
                  <div><label className={LBL}>Ano</label><input value={es.year} onChange={(e) => setEditingSchedule({ ...es, year: e.target.value })} className={INP} /></div>
                  <div><label className={LBL}>Turno</label><input value={es.shift} onChange={(e) => setEditingSchedule({ ...es, shift: e.target.value })} className={INP} /></div>
                </div>
                <div className="space-y-2 border border-dashed border-slate-300 rounded-2xl p-3 bg-slate-50">
                  <span className={LBL}>Imagem do horário (do telefone)</span>
                  {es.image
                    ? <img src={es.image} alt="" className="max-h-56 w-full object-contain rounded-xl border bg-white" />
                    : (es.has_image && !es.remove_image)
                      ? <LazyImage imgKey={es.id} zoomable={false} className="max-h-56 w-full object-contain rounded-xl border bg-white" />
                      : <p className="text-[11px] text-slate-400">Nenhuma imagem carregada.</p>}
                  <div className="flex gap-2">
                    <label className={BTN + ' cursor-pointer justify-center'}>
                      {(es.image || (es.has_image && !es.remove_image)) ? 'Trocar imagem' : 'Carregar imagem do horário'}
                      <input type="file" accept="image/*" className="hidden" onChange={async (e) => {
                        const fl = e.target.files[0]; e.target.value = ''; if (!fl) return;
                        try { const d = await readPicture(fl, 1600, 420000); setEditingSchedule(p => ({ ...p, image: d, remove_image: false })); } catch (er) { alert(er.message || er); }
                      }} />
                    </label>
                    {(es.image || (es.has_image && !es.remove_image)) && <button type="button" onClick={() => setEditingSchedule(p => ({ ...p, image: '', remove_image: true, has_image: false }))} className="h-8 px-3 bg-white border border-red-200 text-red-600 text-xs font-bold rounded-xl">Remover</button>}
                  </div>
                  <p className="text-[10px] text-slate-400">Pode usar só a imagem, ou também preencher a tabela abaixo (opcional).</p>
                </div>
                <div className="overflow-x-auto">
                  <table className="text-xs"><thead><tr><th className="p-1 text-left">Hora</th>{DAYS.map(d => <th key={d[0]} className="p-1 text-left">{d[1]}</th>)}<th></th></tr></thead>
                    <tbody>
                      {es.periods.map((p, i) => (
                        <tr key={i}>
                          <td className="p-1"><input value={p.time} onChange={(e) => setP(i, 'time', e.target.value)} placeholder="07:30 - 08:15" className={INP + ' w-28'} /></td>
                          {DAYS.map(d => <td key={d[0]} className="p-1"><input value={p[d[0]] || ''} onChange={(e) => setP(i, d[0], e.target.value)} className={INP + ' w-32'} /></td>)}
                          <td className="p-1"><button onClick={() => setEditingSchedule({ ...es, periods: es.periods.filter((_, n) => n !== i) })} className="text-red-500 px-1">×</button></td>
                        </tr>
                      ))}
                    </tbody></table>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setEditingSchedule({ ...es, periods: [...es.periods, { time: '', seg: '', ter: '', qua: '', qui: '', sex: '' }] })} className="h-9 px-3 bg-white border border-slate-200 text-xs font-bold rounded-xl">+ Período</button>
                  <button onClick={async () => { if (es.id) delete imgCache[es.id]; if (await act('saveSchedule', es, 'Horário guardado.')) setEditingSchedule(null); }} className={BTN + ' h-9 flex-1 justify-center'}>Guardar Horário</button>
                </div>
              </Modal>
            );
          })()}

          {activityModal && (
            <Modal title={`Actividades — ${activityModal.user.username}`} onClose={() => setActivityModal(null)}>
              <div className="space-y-1.5">
                {activityModal.items.length === 0 && <p className="text-xs text-slate-400 text-center py-4">Sem actividade registada.</p>}
                {activityModal.items.map((a, i) => (
                  <div key={i} className="p-2 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                    <div className="flex justify-between"><span className="font-bold text-slate-800">{a.action}</span><span className="text-slate-400 font-mono">{a.time}</span></div>
                    {a.details && <p className="text-[10px] text-slate-500 break-all">{a.details}</p>}
                  </div>
                ))}
              </div>
            </Modal>
          )}

          {selectedScheduleView && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white w-full max-w-2xl rounded-3xl p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="text-sm font-bold text-slate-900">
                    Horário Semanal — {selectedScheduleView.class_name} ({selectedScheduleView.year})
                  </h3>
                  <button onClick={() => setSelectedScheduleView(null)} className="text-slate-400 hover:text-slate-700 text-lg">×</button>
                </div>
                {selectedScheduleView.has_image && <LazyImage imgKey={selectedScheduleView.id} title={'Horário — ' + selectedScheduleView.class_name} className="w-full rounded-xl border border-slate-200" />}
                <div className={'overflow-x-auto' + ((selectedScheduleView.periods || []).length ? '' : ' hidden')}>
                  <table className="w-full text-xs text-left border border-slate-200 rounded-xl whitespace-nowrap">
                    <thead className="bg-slate-50 text-slate-700 font-bold">
                      <tr>
                        <th className="p-2 border-b">Horário</th>
                        <th className="p-2 border-b">Segunda</th>
                        <th className="p-2 border-b">Terça</th>
                        <th className="p-2 border-b">Quarta</th>
                        <th className="p-2 border-b">Quinta</th>
                        <th className="p-2 border-b">Sexta</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {selectedScheduleView.periods?.map((p, idx) => (
                        <tr key={idx}>
                          <td className="p-2 font-semibold text-slate-500 bg-slate-50/50">{p.time}</td>
                          <td className="p-2">{p.seg}</td>
                          <td className="p-2">{p.ter}</td>
                          <td className="p-2">{p.qua}</td>
                          <td className="p-2">{p.qui}</td>
                          <td className="p-2">{p.sex}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ─────────────────────────────────────────────────────────────────────
              ASSISTENTE VIRTUAL IA (FLUTUANTE NO CANTO INFERIOR DIREITO)
          ────────────────────────────────────────────────────────────────────── */}
          <div className="fixed bottom-4 right-4 z-40">
            {aiOpen ? (
              <div className="w-80 sm:w-96 bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col h-[420px]">
                <div className="bg-[#16a34a] p-3 text-white flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <i data-lucide="sparkles" className="w-4 h-4"></i>
                    <span className="font-bold text-xs">Assistente Virtual CECAVI IA</span>
                  </div>
                  <button onClick={() => setAiOpen(false)} className="text-white hover:opacity-80 text-lg font-bold">×</button>
                </div>

                <div className="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
                  {aiMessages.map((m, i) => (
                    <div
                      key={i}
                      className={`p-2.5 rounded-2xl max-w-[85%] whitespace-pre-wrap ${
                        m.role === 'user'
                          ? 'bg-[#16a34a] text-white ml-auto'
                          : 'bg-slate-100 text-slate-800'
                      }`}
                    >
                      {m.text}
                    </div>
                  ))}
                </div>

                <form onSubmit={handleSendAi} className="p-2 border-t border-slate-100 flex gap-1.5 bg-slate-50">
                  <input
                    value={aiInput}
                    onChange={(e) => setAiInput(e.target.value)}
                    placeholder={aiBusy ? 'A pensar...' : 'Faça uma pergunta...'}
                    className="flex-1 h-8 px-2.5 text-xs bg-white border border-slate-200 rounded-xl outline-none"
                  />
                  <button type="submit" className="h-8 px-3 bg-[#16a34a] text-white rounded-xl text-xs font-bold">
                    <i data-lucide="send" className="w-3.5 h-3.5"></i>
                  </button>
                </form>
              </div>
            ) : (
              <button
                onClick={() => setAiOpen(true)}
                className="h-12 w-12 rounded-full bg-[#16a34a] hover:bg-[#15803d] text-white shadow-lg flex items-center justify-center transition-all hover:scale-105"
                title="Conversar com a Assistente Virtual IA"
              >
                <i data-lucide="sparkles" className="w-6 h-6"></i>
              </button>
            )}
          </div>
          <OverlayHost />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
